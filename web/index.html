<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Sostituito da `flutter build web --base-href` (su GitHub Pages: /nome-repository/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vaultly: conti, movimenti e password. I dati restano solo sul telefono.">
  <meta name="theme-color" content="#0f1115">

  <!-- Installazione su iPhone: Condividi → Aggiungi a schermata Home -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Vaultly">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Nessun contenuto esterno: tutto viene da questo sito; nessuna richiesta verso altri indirizzi. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; worker-src 'self' blob:">

  <title>Vaultly</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #0f1115; height: 100%; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 96px; height: 96px; opacity: .9; }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt=""></div>
  <script>
    // A ogni apertura i file dell'app si chiedono con un indirizzo nuovo ("?v=..."): così il
    // browser non riusa una copia vecchia e gli aggiornamenti arrivano subito. Il service worker
    // li salva senza "?v", per aprire l'app anche senza internet.
    (function () {
      var version = String(Date.now());
      window.vaultlyLoadVersion = version;
      function load(src, next) {
        var script = document.createElement("script");
        script.src = src + "?v=" + version;
        if (next) { script.onload = next; script.onerror = next; }
        document.body.appendChild(script);
      }
      load("device_key.js", function () { load("flutter_bootstrap.js"); });
    })();
  </script>
</body>
</html>
